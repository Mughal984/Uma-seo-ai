name: Test and dependency audit
on:
  push:
    branches: [main, "work/**", "cloudflare-free-migration"]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Validate Cloudflare Worker bundle (dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/uma-seo-ai-worker
      - name: Fail on remaining dependency vulnerabilities
        run: npm audit --audit-level=low
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:x.name)}))},null,2))"
