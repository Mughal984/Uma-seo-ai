name = "uma-seo-ai"
main = "worker/index.js"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "uma-seo-ai"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
